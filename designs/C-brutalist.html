<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案C · Neo-Brutalist 贴纸墙</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e5;--ink:#141414;--y:#ffd02f;--p:#ff5c8a;--b:#4d7cfe;--g:#2fd08c}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Archivo',sans-serif}
body{background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background-image:linear-gradient(rgba(20,20,20,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(20,20,20,.06) 1px,transparent 1px);
  background-size:32px 32px}
header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:3px solid var(--ink);background:var(--y)}
h1{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:1px;text-transform:uppercase}
.badge{font-size:11px;font-weight:700;background:var(--ink);color:var(--y);padding:4px 10px;transform:rotate(-2deg);letter-spacing:2px}
.switch{margin-left:auto;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;
  font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.switch .tg{width:52px;height:28px;border:3px solid var(--ink);background:#fff;position:relative;transition:.15s}
.switch .tg::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--ink);transition:.15s}
body.editing .switch .tg{background:var(--p)}
body.editing .switch .tg::after{left:26px;background:#fff}
main{flex:1;overflow:auto;padding:24px 22px}
.row{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.cell{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:13px 16px;
  min-width:160px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.cell .d{font-weight:700;font-size:14px}
.cell .c{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#666;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.row:nth-child(4n+1) .cell:nth-child(4n+1){background:var(--y)}
.row:nth-child(4n+1) .cell:nth-child(4n+2){background:#fff}
.row:nth-child(4n+1) .cell:nth-child(4n+3){background:#dbe7ff}
.row:nth-child(4n+2) .cell:nth-child(4n+1){background:#ffe0ea}
.row:nth-child(4n+2) .cell:nth-child(4n+2){background:#dcf7ea}
.cell:nth-child(odd){transform:rotate(-.6deg)}.cell:nth-child(even){transform:rotate(.5deg)}
.cell:hover{transform:translate(-2px,-2px) rotate(0);box-shadow:8px 8px 0 var(--ink)}
.cell:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
body.editing .cell{background:var(--p)!important;color:#fff}
body.editing .cell .c{color:rgba(255,255,255,.8)}
.addcol{width:40px;height:40px;border:3px dashed var(--ink);background:none;font-size:20px;font-weight:700;
  cursor:pointer;transition:.12s}
.addcol:hover{background:var(--b);color:#fff;border-style:solid}
.addrow{margin:8px 22px 22px;padding:13px;border:3px dashed var(--ink);background:none;
  font-family:'Archivo Black';font-size:14px;letter-spacing:2px;cursor:pointer;transition:.12s;text-transform:uppercase}
.addrow:hover{background:var(--g);border-style:solid}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(90px) rotate(-2deg);
  background:var(--ink);color:var(--y);border:3px solid var(--ink);box-shadow:5px 5px 0 rgba(20,20,20,.25);
  padding:10px 26px;font-family:'Archivo Black';font-size:14px;letter-spacing:1px;transition:.25s cubic-bezier(.2,.9,.3,1.3);opacity:0}
#toast.show{transform:translateX(-50%) translateY(0) rotate(-2deg);opacity:1}
#modal{position:fixed;inset:0;background:rgba(20,20,20,.45);display:none;align-items:center;justify-content:center}
#modal.open{display:flex}
.box{width:540px;background:#fff;border:3px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:24px;
  animation:pop .2s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.9) rotate(-1deg);opacity:0}}
.box h3{font-family:'Archivo Black';font-size:18px;text-transform:uppercase;letter-spacing:1px;
  background:var(--y);display:inline-block;padding:3px 10px;margin-bottom:8px}
.box label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin:12px 0 5px}
.box textarea{width:100%;border:3px solid var(--ink);padding:10px;font-size:13px;
  font-family:'IBM Plex Mono',monospace;resize:vertical;outline:none;background:var(--bg)}
.box textarea:focus{background:#fff;box-shadow:4px 4px 0 var(--y)}
.actions{display:flex;justify-content:space-between;margin-top:16px}
.btn{padding:9px 18px;font-family:'Archivo Black';font-size:12px;letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);transition:.1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.save{background:var(--g)}.btn.del{background:var(--p);color:#fff}
</style>
</head>
<body>
<header>
  <h1>SQL 剪切板</h1>
  <div class="badge">COPY·PASTE·GO</div>
  <div class="switch" onclick="document.body.classList.toggle('editing')">
    <span>编辑模式</span><div class="tg"></div>
  </div>
</header>
<main id="grid"></main>
<button class="addrow" onclick="addRow()">＋ 添加行</button>
<div id="toast">✓ 已复制!</div>
<div id="modal"><div class="box">
  <h3>编辑单元格</h3>
  <label>显示值</label><textarea id="mDisp" rows="2"></textarea>
  <label>复制值 (SQL)</label><textarea id="mCopy" rows="6"></textarea>
  <div class="actions">
    <button class="btn del" onclick="delCell()">删除</button>
    <span><button class="btn" onclick="closeModal()">取消</button>
    <button class="btn save" onclick="saveCell()">保存</button></span>
  </div>
</div></div>
<script>
let data=[
 [{d:"活跃用户查询",c:"SELECT * FROM users WHERE status='active' AND last_login > DATE('now','-30 day');"},
  {d:"月度订单统计",c:"SELECT strftime('%Y-%m',created_at) m, COUNT(*), SUM(amount) FROM orders GROUP BY m;"},
  {d:"库存预警",c:"SELECT sku,name,qty FROM inventory WHERE qty < safe_qty;"},
  {d:"新客转化",c:"SELECT COUNT(*) FROM users WHERE first_order IS NOT NULL;"}],
 [{d:"权限审计",c:"SELECT u.name,r.role FROM users u JOIN user_roles r ON u.id=r.uid WHERE r.role='admin';"},
  {d:"数据去重",c:"DELETE FROM logs WHERE id NOT IN (SELECT MIN(id) FROM logs GROUP BY hash);"}],
 [{d:"慢查询TOP10",c:"SELECT sql_text,avg_time FROM perf ORDER BY avg_time DESC LIMIT 10;"}]
];
let cur=null;
function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  data.forEach((row,ri)=>{
    const r=document.createElement('div');r.className='row';
    row.forEach((cell,ci)=>{
      const el=document.createElement('div');el.className='cell';
      el.innerHTML='<div class="d">'+cell.d+'</div><div class="c">'+(cell.c||'— no sql —')+'</div>';
      el.onclick=()=>clickCell(ri,ci);r.appendChild(el);
    });
    const b=document.createElement('button');b.className='addcol';b.textContent='＋';
    b.onclick=()=>{data[ri].push({d:'显示值',c:''});render()};r.appendChild(b);
    g.appendChild(r);
  });
}
function clickCell(ri,ci){
  if(document.body.classList.contains('editing')){cur=[ri,ci];
    document.getElementById('mDisp').value=data[ri][ci].d;
    document.getElementById('mCopy').value=data[ri][ci].c;
    document.getElementById('modal').classList.add('open');}
  else{const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200);}
}
function addRow(){data.push([{d:'显示值',c:''}]);render()}
function saveCell(){data[cur[0]][cur[1]].d=document.getElementById('mDisp').value||'显示值';
  data[cur[0]][cur[1]].c=document.getElementById('mCopy').value;closeModal();render()}
function delCell(){data[cur[0]].splice(cur[1],1);if(!data[cur[0]].length)data.splice(cur[0],1);closeModal();render()}
function closeModal(){document.getElementById('modal').classList.remove('open')}
render();
</script>
</body>
</html>
