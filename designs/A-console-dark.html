<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案A · Query Deck</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --panel:#111823; --panel2:#0e141d; --line:#1f2c3d;
  --txt:#d7e3f0; --dim:#5b7186; --acc:#3ee6a8; --acc2:#58a6ff; --warn:#ffb454;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'JetBrains Mono',monospace}
body{background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px);}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel2)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#233246}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.title{font-weight:800;font-size:15px;letter-spacing:2px;color:var(--acc)}
.title .cur{display:inline-block;width:9px;height:16px;background:var(--acc);vertical-align:-2px;margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.switch{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.switch .tg{width:44px;height:22px;border:1px solid var(--line);border-radius:20px;position:relative;transition:.25s;background:var(--panel)}
.switch .tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:.25s}
body.editing .switch{color:var(--warn)}
body.editing .switch .tg{border-color:var(--warn);background:rgba(255,180,84,.1)}
body.editing .switch .tg::after{left:24px;background:var(--warn)}
main{flex:1;overflow:auto;padding:22px 20px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cell{position:relative;padding:12px 16px;border:1px solid var(--line);background:var(--panel);
  font-size:13px;cursor:pointer;transition:.18s;min-width:140px}
.cell::before{content:">";color:var(--acc);margin-right:8px;font-weight:600}
.cell small{display:block;color:var(--dim);font-size:10px;margin-top:4px;letter-spacing:1px}
.cell:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 18px rgba(62,230,168,.15);transform:translateY(-1px)}
body.editing .cell{border-style:dashed;border-color:var(--warn)}
body.editing .cell::before{content:"✎";color:var(--warn)}
.addcol{width:34px;height:34px;border:1px dashed var(--line);background:none;color:var(--dim);cursor:pointer;font-size:16px;transition:.18s}
.addcol:hover{border-color:var(--acc2);color:var(--acc2)}
.addrow{margin:6px 20px 20px;padding:12px;border:1px dashed var(--line);background:none;color:var(--dim);
  font-size:13px;cursor:pointer;letter-spacing:2px;transition:.18s}
.addrow:hover{border-color:var(--acc);color:var(--acc)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--acc);color:#06281c;
  padding:9px 22px;font-size:13px;font-weight:600;transition:.3s;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#modal{position:fixed;inset:0;background:rgba(4,8,12,.7);display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal.open{display:flex}
.box{width:520px;background:var(--panel);border:1px solid var(--acc);box-shadow:0 0 40px rgba(62,230,168,.12);padding:22px}
.box h3{font-size:13px;letter-spacing:2px;color:var(--acc);margin-bottom:14px}
.box label{display:block;font-size:11px;color:var(--dim);margin:12px 0 5px;letter-spacing:1px}
.box textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:10px;font-size:13px;font-family:inherit;resize:vertical;outline:none}
.box textarea:focus{border-color:var(--acc)}
.actions{display:flex;justify-content:space-between;margin-top:16px}
.btn{padding:8px 18px;font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--txt)}
.btn.save{border-color:var(--acc);color:var(--acc)}.btn.save:hover{background:var(--acc);color:#06281c}
.btn.del{border-color:#ff5f57;color:#ff5f57}.btn.del:hover{background:#ff5f57;color:#fff}
</style>
</head>
<body>
<header>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="title">SQL_CLIPBOARD<span class="cur"></span></div>
  <div class="switch" onclick="document.body.classList.toggle('editing')">
    <span>编辑模式</span><div class="tg"></div>
  </div>
</header>
<main id="grid"></main>
<button class="addrow" onclick="addRow()">+ 添加行</button>
<div id="toast">✓ 已复制到剪贴板</div>
<div id="modal"><div class="box">
  <h3>// 编辑单元格</h3>
  <label>显示值</label><textarea id="mDisp" rows="2"></textarea>
  <label>复制值 (SQL)</label><textarea id="mCopy" rows="6"></textarea>
  <div class="actions">
    <button class="btn del" onclick="delCell()">删除该单元格</button>
    <span><button class="btn" onclick="closeModal()">取消</button>
    <button class="btn save" onclick="saveCell()">保存</button></span>
  </div>
</div></div>
<script>
let data=[
 [{d:"活跃用户查询",c:"SELECT * FROM users WHERE status='active' AND last_login > DATE('now','-30 day');"},
  {d:"月度订单统计",c:"SELECT strftime('%Y-%m',created_at) m, COUNT(*), SUM(amount) FROM orders GROUP BY m;"},
  {d:"库存预警",c:"SELECT sku,name,qty FROM inventory WHERE qty < safe_qty;"}],
 [{d:"权限审计",c:"SELECT u.name,r.role FROM users u JOIN user_roles r ON u.id=r.uid WHERE r.role='admin';"},
  {d:"数据去重",c:"DELETE FROM logs WHERE id NOT IN (SELECT MIN(id) FROM logs GROUP BY hash);"}],
 [{d:"慢查询TOP10",c:"SELECT sql_text,avg_time FROM perf ORDER BY avg_time DESC LIMIT 10;"}]
];
let cur=null;
function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  data.forEach((row,ri)=>{
    const r=document.createElement('div');r.className='row';
    row.forEach((cell,ci)=>{
      const el=document.createElement('div');el.className='cell';
      el.innerHTML=cell.d+'<small>ROW '+(ri+1)+' · COL '+(ci+1)+'</small>';
      el.onclick=()=>clickCell(ri,ci);r.appendChild(el);
    });
    const b=document.createElement('button');b.className='addcol';b.textContent='+';
    b.onclick=()=>{data[ri].push({d:'显示值',c:''});render()};r.appendChild(b);
    g.appendChild(r);
  });
}
function clickCell(ri,ci){
  if(document.body.classList.contains('editing')){cur=[ri,ci];
    document.getElementById('mDisp').value=data[ri][ci].d;
    document.getElementById('mCopy').value=data[ri][ci].c;
    document.getElementById('modal').classList.add('open');}
  else{const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}
}
function addRow(){data.push([{d:'显示值',c:''}]);render()}
function saveCell(){data[cur[0]][cur[1]].d=document.getElementById('mDisp').value||'显示值';
  data[cur[0]][cur[1]].c=document.getElementById('mCopy').value;closeModal();render()}
function delCell(){data[cur[0]].splice(cur[1],1);if(!data[cur[0]].length)data.splice(cur[0],1);closeModal();render()}
function closeModal(){document.getElementById('modal').classList.remove('open')}
render();
</script>
</body>
</html>
