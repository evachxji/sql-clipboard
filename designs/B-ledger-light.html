<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案B · Ledger 纸上账簿</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f2ea; --card:#fffdf7; --ink:#211d15; --mute:#8a8172;
  --line:#e4ddcd; --acc:#b3541e; --acc-soft:#f3e3d8; --blue:#2952cc;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans',sans-serif}
body{background:var(--paper);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(rgba(179,84,30,.05) 1px,transparent 1px);background-size:26px 26px}
header{display:flex;align-items:baseline;gap:16px;padding:22px 28px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-family:'Fraunces',serif;font-size:24px;font-weight:700;letter-spacing:.5px}
h1 em{font-style:italic;color:var(--acc)}
.sub{font-size:12px;color:var(--mute);letter-spacing:2px;text-transform:uppercase}
.switch{margin-left:auto;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:13px;font-weight:500}
.switch .tg{width:46px;height:25px;border-radius:20px;border:1.5px solid var(--ink);position:relative;transition:.25s;background:transparent}
.switch .tg::after{content:"";position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:.25s}
body.editing .switch .tg{background:var(--ink)}
body.editing .switch .tg::after{left:23px;background:var(--card)}
main{flex:1;overflow:auto;padding:24px 28px}
.row{display:flex;align-items:stretch;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;
  min-width:170px;cursor:pointer;position:relative;transition:.18s;
  box-shadow:0 1px 2px rgba(33,29,21,.05)}
.cell::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--line);transition:.18s}
.cell .d{font-weight:600;font-size:14px;padding-left:8px}
.cell .c{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mute);padding-left:8px;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.cell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(33,29,21,.1);border-color:var(--acc)}
.cell:hover::before{background:var(--acc)}
body.editing .cell{border:1.5px dashed var(--acc);background:var(--acc-soft)}
body.editing .cell::before{background:var(--acc)}
.addcol{width:38px;border:1.5px dashed var(--line);border-radius:10px;background:none;color:var(--mute);
  font-size:18px;cursor:pointer;transition:.18s}
.addcol:hover{border-color:var(--blue);color:var(--blue)}
.addrow{margin:4px 28px 22px;padding:13px;border:1.5px dashed var(--line);border-radius:10px;background:none;
  color:var(--mute);font-size:13px;font-weight:500;cursor:pointer;transition:.18s;font-family:inherit}
.addrow:hover{border-color:var(--acc);color:var(--acc);background:var(--card)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--paper);
  padding:10px 24px;border-radius:30px;font-size:13px;transition:.3s cubic-bezier(.2,.8,.2,1);opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#modal{position:fixed;inset:0;background:rgba(33,29,21,.35);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal.open{display:flex}
.box{width:540px;background:var(--card);border-radius:16px;padding:26px;box-shadow:0 24px 60px rgba(33,29,21,.25);
  animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.box h3{font-family:'Fraunces',serif;font-size:19px;margin-bottom:6px}
.box label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin:14px 0 6px;font-weight:600}
.box textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:11px;font-size:13.5px;
  font-family:'IBM Plex Mono',monospace;resize:vertical;outline:none;background:var(--paper);color:var(--ink)}
.box textarea:focus{border-color:var(--acc)}
.actions{display:flex;justify-content:space-between;margin-top:18px}
.btn{padding:9px 20px;border-radius:30px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:none;color:var(--ink);transition:.15s}
.btn.save{border-color:var(--acc);background:var(--acc);color:#fff}.btn.save:hover{filter:brightness(1.1)}
.btn.del{color:#b3261e;border-color:#ecc8c5}.btn.del:hover{background:#b3261e;color:#fff}
</style>
</head>
<body>
<header>
  <h1>SQL <em>剪切板</em></h1>
  <div class="sub">Query Ledger · 账簿</div>
  <div class="switch" onclick="document.body.classList.toggle('editing')">
    <span>编辑模式</span><div class="tg"></div>
  </div>
</header>
<main id="grid"></main>
<button class="addrow" onclick="addRow()">＋ 添加行</button>
<div id="toast">已复制到剪贴板 ✓</div>
<div id="modal"><div class="box">
  <h3>编辑单元格</h3>
  <label>显示值</label><textarea id="mDisp" rows="2" style="font-family:'IBM Plex Sans'"></textarea>
  <label>复制值 (SQL)</label><textarea id="mCopy" rows="6"></textarea>
  <div class="actions">
    <button class="btn del" onclick="delCell()">删除该单元格</button>
    <span><button class="btn" onclick="closeModal()">取消</button>
    <button class="btn save" onclick="saveCell()">保存</button></span>
  </div>
</div></div>
<script>
let data=[
 [{d:"活跃用户查询",c:"SELECT * FROM users WHERE status='active' AND last_login > DATE('now','-30 day');"},
  {d:"月度订单统计",c:"SELECT strftime('%Y-%m',created_at) m, COUNT(*), SUM(amount) FROM orders GROUP BY m;"},
  {d:"库存预警",c:"SELECT sku,name,qty FROM inventory WHERE qty < safe_qty;"}],
 [{d:"权限审计",c:"SELECT u.name,r.role FROM users u JOIN user_roles r ON u.id=r.uid WHERE r.role='admin';"},
  {d:"数据去重",c:"DELETE FROM logs WHERE id NOT IN (SELECT MIN(id) FROM logs GROUP BY hash);"}],
 [{d:"慢查询TOP10",c:"SELECT sql_text,avg_time FROM perf ORDER BY avg_time DESC LIMIT 10;"}]
];
let cur=null;
function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  data.forEach((row,ri)=>{
    const r=document.createElement('div');r.className='row';
    row.forEach((cell,ci)=>{
      const el=document.createElement('div');el.className='cell';
      el.innerHTML='<div class="d">'+cell.d+'</div><div class="c">'+(cell.c||'— 未设置 SQL —')+'</div>';
      el.onclick=()=>clickCell(ri,ci);r.appendChild(el);
    });
    const b=document.createElement('button');b.className='addcol';b.textContent='＋';
    b.onclick=()=>{data[ri].push({d:'显示值',c:''});render()};r.appendChild(b);
    g.appendChild(r);
  });
}
function clickCell(ri,ci){
  if(document.body.classList.contains('editing')){cur=[ri,ci];
    document.getElementById('mDisp').value=data[ri][ci].d;
    document.getElementById('mCopy').value=data[ri][ci].c;
    document.getElementById('modal').classList.add('open');}
  else{const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}
}
function addRow(){data.push([{d:'显示值',c:''}]);render()}
function saveCell(){data[cur[0]][cur[1]].d=document.getElementById('mDisp').value||'显示值';
  data[cur[0]][cur[1]].c=document.getElementById('mCopy').value;closeModal();render()}
function delCell(){data[cur[0]].splice(cur[1],1);if(!data[cur[0]].length)data.splice(cur[0],1);closeModal();render()}
function closeModal(){document.getElementById('modal').classList.remove('open')}
render();
</script>
</body>
</html>
