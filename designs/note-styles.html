<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文本单元格 · 三种风格</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f2ea;--card:#fffdf7;--ink:#211d15;--mute:#8a8172;--line:#e4ddcd;--acc:#b3541e;--acc-soft:#f3e3d8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans',sans-serif}
body{background:var(--paper);color:var(--ink);padding:34px 40px;
  background-image:radial-gradient(rgba(179,84,30,.05) 1px,transparent 1px);background-size:26px 26px}
.variant{margin-bottom:38px}
.vtag{display:inline-block;font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:4px}
.vtag em{font-style:italic;color:var(--acc)}
.vdesc{font-size:11.5px;color:var(--mute);margin-bottom:14px;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
/* 可复制卡片（现有样式） */
.cell{flex:0 1 auto;min-width:0;max-width:200px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:7px 12px 7px 14px;cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(33,29,21,.05)}
.cell::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc)}
.cell .d{font-weight:600;font-size:13px;white-space:nowrap}
/* ---- 方案A：旁注 margin note ---- */
.noteA{flex:0 1 auto;min-width:0;position:relative;padding:3px 2px 3px 12px;cursor:default}
.noteA::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--mute);opacity:.5;border-radius:2px}
.noteA .d{font-size:13px;color:var(--mute);font-style:italic;font-family:'Fraunces',serif;font-weight:500;white-space:nowrap;letter-spacing:.3px}
/* ---- 方案B：荧光笔 highlighter ---- */
.noteB{flex:0 1 auto;min-width:0;padding:3px 7px;cursor:default}
.noteB .d{font-size:13px;color:var(--ink);font-weight:500;white-space:nowrap;
  background:linear-gradient(180deg,transparent 55%,rgba(179,84,30,.22) 55%,rgba(179,84,30,.22) 92%,transparent 92%)}
/* ---- 方案C：词条 index entry ---- */
.noteC{flex:0 1 auto;min-width:0;padding:3px 2px;cursor:default}
.noteC .d{font-size:13px;color:var(--mute);white-space:nowrap;
  border-bottom:1.5px dotted rgba(138,129,114,.55);padding-bottom:2px}
.noteC .d::before{content:"§";color:var(--acc);margin-right:7px;font-size:12px}
</style>
</head>
<body>
<div class="variant">
  <div class="vtag">A · <em>旁注</em> Margin Note</div>
  <div class="vdesc">衬线斜体 + 细灰左线，像账簿页边的批注，最克制</div>
  <div class="row">
    <div class="cell"><div class="d">活跃用户查询</div></div>
    <div class="noteA"><div class="d">按近30天登录口径</div></div>
    <div class="cell"><div class="d">月度订单统计</div></div>
    <div class="noteA"><div class="d">财务月底对账用</div></div>
  </div>
</div>
<div class="variant">
  <div class="vtag">B · <em>荧光笔</em> Highlighter</div>
  <div class="vdesc">文字下半截刷一道赭石色荧光，像纸上划重点，最醒目</div>
  <div class="row">
    <div class="cell"><div class="d">活跃用户查询</div></div>
    <div class="noteB"><div class="d">按近30天登录口径</div></div>
    <div class="cell"><div class="d">月度订单统计</div></div>
    <div class="noteB"><div class="d">财务月底对账用</div></div>
  </div>
</div>
<div class="variant">
  <div class="vtag">C · <em>词条</em> Index Entry</div>
  <div class="vdesc">§ 节号 + 虚线下划，像书末索引条目，最书卷气</div>
  <div class="row">
    <div class="cell"><div class="d">活跃用户查询</div></div>
    <div class="noteC"><div class="d">按近30天登录口径</div></div>
    <div class="cell"><div class="d">月度订单统计</div></div>
    <div class="noteC"><div class="d">财务月底对账用</div></div>
  </div>
</div>
</body>
</html>
